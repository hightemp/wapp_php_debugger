openapi: 3.0.3
info:
  title: wapp-debugger PHP library HTTP mode
  version: 1.0.0
  description: |
    Optional HTTP mode of the PHP library 2.x for servers without SSH access.
    SSH is the primary way to work; this mode is off by default.

    Security rules:
    - the mode turns on only when the config sets a token of at least 32 characters;
    - the token is sent only in the `X-Debugger-Token` header and compared with `hash_equals`;
    - **without a valid token the library does not answer at all**: the request goes to the application as usual
      (so there is no 401 in this spec — the client gets whatever the application returns, usually 404);
    - optional IP allowlist and rate limiting;
    - no access to source files or config paths; every file name stays inside the logs directory.

    The library handles paths under the `/__wapp_debugger/v1/` prefix before the application.
servers:
  - url: '{base_url}'
    variables:
      base_url:
        default: https://shop.example.test
        description: Address of the application the library is installed in
security:
  - debugger_token: []

paths:
  /__wapp_debugger/v1/status:
    get:
      operationId: getStatus
      summary: Debugger state in the project
      responses:
        '200':
          description: State
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        default: { $ref: '#/components/responses/Problem' }

  /__wapp_debugger/v1/enabled:
    put:
      operationId: setEnabled
      summary: Turn logging on or off
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              additionalProperties: false
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: New state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        default: { $ref: '#/components/responses/Problem' }

  /__wapp_debugger/v1/logs:
    get:
      operationId: listLogs
      summary: Log files sorted by name
      responses:
        '200':
          description: Files
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: array
                    items: { $ref: '#/components/schemas/LogFile' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: clearLogs
      summary: Delete all log files
      responses:
        '200':
          description: Number of removed files
          content:
            application/json:
              schema:
                type: object
                required: [removed_files]
                properties:
                  removed_files: { type: integer, minimum: 0 }
        default: { $ref: '#/components/responses/Problem' }

  /__wapp_debugger/v1/logs/{name}:
    get:
      operationId: readLog
      summary: Read part of a log file
      description: |
        Returns up to limit bytes starting at offset. An empty body means end of file.
        416 means offset is past the end of the file (it was truncated or replaced).
      parameters:
        - { $ref: '#/components/parameters/Name' }
        - name: offset
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 8388608, default: 1048576 }
      responses:
        '200':
          description: File bytes
          headers:
            X-File-Size:
              description: Full file size
              schema: { type: integer, format: int64 }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: removeLog
      summary: Delete a log file
      parameters: [{ $ref: '#/components/parameters/Name' }]
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    debugger_token:
      type: apiKey
      in: header
      name: X-Debugger-Token

  parameters:
    Name:
      name: name
      in: path
      required: true
      description: File name without a path (as in listLogs)
      schema:
        type: string
        pattern: '^[^/\\]+$'

  responses:
    Problem:
      description: Error (only for requests with a valid token)
      content:
        application/problem+json:
          schema:
            type: object
            required: [title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }

  schemas:
    Status:
      type: object
      required: [enabled, library_version, format_version, logs_dir_writable]
      properties:
        enabled: { type: boolean }
        library_version: { type: string }
        format_version: { type: integer, enum: [2] }
        php_version: { type: string }
        logs_dir_writable: { type: boolean }
        disk_free_bytes: { type: integer, format: int64, nullable: true }
      example: { enabled: true, library_version: 2.0.0, format_version: 2, php_version: 7.4.33, logs_dir_writable: true, disk_free_bytes: 10737418240 }

    LogFile:
      type: object
      required: [name, size, modified_at]
      properties:
        name: { type: string }
        size: { type: integer, format: int64, minimum: 0 }
        modified_at: { type: integer, format: int64, description: ms since the epoch }
      example: { name: 1792400000000-01JAZ7Q5X0K4M8T2V6N9P3R5S7.jsonl, size: 2048, modified_at: 1792400000040 }
