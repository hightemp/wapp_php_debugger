# Server release build. Locally: make release-snapshot; in CI: release.yml.
# The UI is built beforehand (make ui-build) and embedded with the embedui tag.
# The desktop app is built separately on each OS (requires CGO) by release.yml and added to the release.
version: 2
project_name: wapp-debugger
dist: dist/release

git:
  # The legacy-hotfix tag belongs to the old version and is not SemVer
  ignore_tags: ['legacy-*']

before:
  hooks:
    - test -f server/web/dist/index.html
    - test -f dist/wapp-debugger.php

builds:
  - id: wapp-debugger
    dir: server
    main: ./cmd/wapp-debugger
    binary: wapp-debugger
    env: [CGO_ENABLED=0]
    tags: [embedui]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/hightemp/wapp_php_debugger/server/internal/version.Version={{ .Version }}
      - -X github.com/hightemp/wapp_php_debugger/server/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/hightemp/wapp_php_debugger/server/internal/version.Date={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files: [README.md, LICENSE*]

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: dist/wapp-debugger.php
    - glob: scripts/install.sh

snapshot:
  version_template: '0.0.0-snapshot-{{ .ShortCommit }}'

# A software bill of materials of each archive (syft; CI installs it, a local snapshot skips it without)
sboms:
  - artifacts: archive

# Release notes from Conventional Commits since the previous tag: what a user of the viewer, the
# desktop app or the library notices. Tests, CI, builds and docs stay in the history.
changelog:
  use: git
  sort: asc
  abbrev: 7
  filters:
    exclude:
      - '^(test|ci|build|chore|style|refactor)(\(.+\))?!?:'
      - '^docs(\(plan\))?:.*iteration done'
      - '^Merge '
  groups:
    - title: Breaking changes
      regexp: '^\w+(\(.+\))?!:'
      order: 0
    - title: New
      regexp: '^feat(\(.+\))?:'
      order: 1
    - title: Fixes
      regexp: '^fix(\(.+\))?:'
      order: 2
    - title: Security
      regexp: '^sec(urity)?(\(.+\))?:'
      order: 3
    - title: Documentation
      regexp: '^docs(\(.+\))?:'
      order: 4
    - title: Other
      order: 999

release:
  # The one-file PHP library (make php-bundle): curl -fsSLO …/releases/latest/download/wapp-debugger.php
  extra_files:
    - glob: dist/wapp-debugger.php
    # curl -fsSL …/releases/latest/download/install.sh | sh
    - glob: scripts/install.sh
  footer: |
    Every file is attested by the release workflow (build provenance):
    `gh attestation verify <file> --repo hightemp/wapp_php_debugger`; `checksums.txt` has
    the SHA-256 of each, `*.sbom.json` the components of each server archive.
  # Published by hand after a look at the notes and the desktop archives the release workflow adds
  draft: true
  replace_existing_draft: true
  prerelease: auto
