# Сборка релиза сервера (п. 3.2 плана). Локально: make release-snapshot; в CI — release.yml (фаза 5).
# UI собирается заранее (make ui-build) и встраивается тегом embedui.
# Десктоп собирается отдельно на каждой ОС (нужен CGO) — job desktop в CI.
version: 2
project_name: wapp-debugger
dist: dist/release

git:
  # Тег legacy-hotfix относится к старой версии и не SemVer
  ignore_tags: ['legacy-*']

before:
  hooks:
    - test -f server/web/dist/index.html

builds:
  - id: wapp-debugger
    dir: server
    main: ./cmd/wapp-debugger
    binary: wapp-debugger
    env: [CGO_ENABLED=0]
    tags: [embedui]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/hightemp/wapp_php_debugger/server/internal/version.Version={{ .Version }}
      - -X github.com/hightemp/wapp_php_debugger/server/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/hightemp/wapp_php_debugger/server/internal/version.Date={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files: [README.md, LICENSE*]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: '0.0.0-snapshot-{{ .ShortCommit }}'

changelog:
  disable: true
