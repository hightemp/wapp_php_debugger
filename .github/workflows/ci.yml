# Checks on every push and pull request. The commands are the same make targets as locally.
name: CI

on:
  # One developer, one branch per phase: check every push to any branch
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:
  # release.yml runs the whole CI before publishing anything
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The PHP matrix and the desktop on three systems run only when a change concerns them; a skipped
  # job counts as passed. A tag, a new branch or a manual run checks everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      php: ${{ steps.areas.outputs.php }}
      desktop: ${{ steps.areas.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: areas
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && github.event.before || '') }}
        run: scripts/changed-areas.sh "$BASE" HEAD | tee -a "$GITHUB_OUTPUT"

  php-test:
    name: PHP ${{ matrix.php }} tests${{ matrix.psr-log && format(' (psr/log {0})', matrix.psr-log) || '' }}
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The library supports PHP 7.4+. Without a lock file every PHP gets its own dependency line:
        # 7.4 and 8.0 — Monolog 2 with psr/log 1 or 3, 8.1+ — Monolog 3 with psr/log 3
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
        include:
          # psr/log 2 is never picked by itself: the 8.1 job pins it (8.2+ keep psr/log 3)
          - php: '8.1'
            psr-log: '^2.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: make php-deps
      - name: Pin psr/log
        if: matrix.psr-log
        run: cd client-php && composer require --dev "psr/log:${{ matrix.psr-log }}" -W --no-interaction --no-progress
      - run: make php-test
      # The same suite against the one-file build
      - run: make php-bundle-test

  php-lint:
    name: PHP lint
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: make php-deps
      - run: make php-lint

  go:
    name: Go lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - run: make tools
      - run: make server-lint
      - run: make server-test
      - run: make server-fuzz
      # SSH against a real OpenSSH server in Docker: host key, SFTP, the debugger switch
      - run: make ssh-e2e
      - run: make workflows-lint

  ui:
    name: UI lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: make ui-deps
      - run: make ui-lint
      - run: make ui-test

  generate:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
      - run: make generate-check
      # The APIs frozen at v1.0 take only backward compatible changes
      - run: make spec-compat

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe for the version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: make ui-deps
      - run: make build
      # The installer from the README one-liner, against a fake GitHub Releases server
      - run: make scripts-lint install-test changed-areas-test release-check-test

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe for the version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: make ui-deps
      - run: cd ui && npx playwright install --with-deps chromium
      - run: make e2e
      # Screens in every theme against ui/e2e/__screenshots__, inside the Playwright image
      - run: make e2e-visual
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 14

  desktop:
    name: Desktop on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Linux dependencies (GTK4, WebKitGTK 6.0, Xvfb)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev xvfb
      # Ubuntu 24.04 restricts unprivileged user namespaces, which the WebKit sandbox (bubblewrap) needs;
      # without this the web process cannot start. The sandbox itself stays on.
      - name: Allow the WebKit sandbox on Ubuntu 24.04
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: GNU Make and NSIS on Windows
        if: runner.os == 'Windows'
        run: |
          command -v make || choco install make -y
          command -v makensis || choco install nsis -y
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"
      - run: make ui-deps
      - run: make desktop-vet
      # A real window opens: REST through the asset handler and the Wails event stream
      - run: make desktop-selftest
      # The same installers release.yml attaches to a release
      - run: make desktop-package
      - name: The AppImage starts on its own libraries
        if: runner.os == 'Linux'
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 GSK_RENDERER=cairo WEBKIT_DISABLE_DMABUF_RENDERER=1 LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a -s "-screen 0 1280x800x24" dist/release-desktop/*.AppImage --self-test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ runner.os }}
          path: dist/release-desktop
          retention-days: 7

  release-snapshot:
    name: Release snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - run: make ui-deps
      - run: make release-snapshot
