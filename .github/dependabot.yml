version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: gomod
    directory: /server
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /ui
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: composer
    directory: /client-php
    schedule: { interval: weekly }
